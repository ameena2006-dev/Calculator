<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input
            type="number"
            id="num1"
            placeholder="First number"
            step="any"
        >

        <select id="operator">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>

        <input
            type="number"
            id="num2"
            placeholder="Second number"
            step="any"
        >

        <button onclick="calculate()">Calculate</button>

        <div id="result">
            Result: 0
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
